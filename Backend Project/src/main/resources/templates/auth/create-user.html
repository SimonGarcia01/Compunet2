<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Gym App</title>
    <link rel="stylesheet" th:href="@{/css/gym-style.css}">
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <div class="page-header">
            <h1>Crear Cuenta</h1>
            <p>Únete a nuestra comunidad fitness</p>
        </div>

        <div class="card" style="max-width: 700px; margin: 0 auto;">
            <div th:if="${param.error}" class="alert alert-danger">
                <span>⚠️</span>
                <span th:text="${param.error}">Error</span>
            </div>

            <form th:action="@{/auth/create-user}" th:object="${user}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label for="email">Email institucional</label>
                    <input id="email" type="email" th:field="*{email}" placeholder="tu@u.icesi.edu.co" required />
                </div>

                <div class="form-group">
                    <label for="name">Nombre completo</label>
                    <input id="name" type="text" th:field="*{name}" placeholder="Juan Pérez" required />
                </div>

                <div class="form-group">
                    <label for="personalId">Identificación personal</label>
                    <input id="personalId" type="text" th:field="*{personalId}" placeholder="1234567890" required />
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password" type="password" th:field="*{encryptedPassword}" placeholder="••••••••" required />
                </div>

                <div class="form-group">
                    <label>Roles</label>
                    <div class="checkbox-group">
                        <div th:each="role : ${roles}" class="checkbox-item">
                            <input type="checkbox" th:id="${'role-' + role.roleId}"
                                   th:name="selectedRoles" th:value="${role.roleId}" />
                            <label th:for="${'role-' + role.roleId}" class="checkbox-label">
                                <span th:text="${role.name}">Role name</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="flex gap-2" style="margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary btn-lg">Crear Usuario</button>
                    <a th:href="@{/auth/login}" class="btn btn-outline btn-lg">Volver al login</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
