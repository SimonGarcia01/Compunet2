<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Privilegio - Gym App</title>
    <link rel="stylesheet" th:href="@{/css/gym-style.css}">
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <div class="page-header">
            <h1>Editar Privilegio</h1>
            <p>Modificar información del permiso</p>
        </div>

        <nav>
            <a th:href="@{/templates/privilege}">← Volver a Privilegios</a>
            <a th:href="@{/home}">🏠 Inicio</a>
        </nav>

        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <div th:if="${success}" class="alert alert-success">
                <span>✓</span>
                <span th:text="${success}"></span>
            </div>

            <div th:if="${error}" class="alert alert-danger">
                <span>⚠️Característica permitida sólo para el rol <strong>Administrador.</strong></span>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{|/templates/privilege/${privilege.privilegeId}/edit|}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="name">Nombre del Privilegio</label>
                    <input id="name" type="text" name="name" th:value="${privilege.name}" required/>
                </div>

                <div class="form-group">
                    <label for="description">Descripción</label>
                    <input id="description" type="text" name="description" th:value="${privilege.description}"/>
                </div>

                <div class="flex gap-2" style="margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary btn-lg">Guardar Cambios</button>
                    <a th:href="@{/templates/privilege}" class="btn btn-outline btn-lg">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
