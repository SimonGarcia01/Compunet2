<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privilegios - Gym App</title>
    <link rel="stylesheet" th:href="@{/css/gym-style.css}">
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <div class="page-header">
            <h1>Gestión de Privilegios</h1>
            <p>Administrar permisos del sistema</p>
        </div>

        <nav>
            <a th:href="@{/home}">🏠 Inicio</a>
            <a th:href="@{/privileges/create}">➕ Crear Privilegio</a>
            <a th:href="@{/roles}">🛡️ Roles</a>
        </nav>

        <div th:if="${success}" class="alert alert-success">
            <span>✓</span>
            <span th:text="${success}"></span>
        </div>

        <div th:if="${error}" class="alert alert-danger">
            <span>⚠️</span>
            <span th:text="${error}"></span>
        </div>

        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${privileges}">
                        <td th:text="${p.privilegeId}">1</td>
                        <td><strong th:text="${p.name}">Ver usuarios</strong></td>
                        <td th:text="${p.description}">Permite ver usuarios</td>
                        <td>
                            <div class="table-actions">
                                <a th:href="@{|/privileges/${p.privilegeId}/edit|}"
                                   class="btn btn-sm btn-primary">
                                    Editar
                                </a>
                                <form th:action="@{|/privileges/${p.privilegeId}/delete|}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm btn-danger"
                                            onclick="return confirm('¿Eliminar privilegio?')">
                                        Eliminar
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(privileges)}">
                        <td colspan="4" class="text-center" style="padding: 2rem;">
                            No hay privilegios registrados
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
