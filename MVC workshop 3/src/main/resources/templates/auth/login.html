<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Gym App</title>
    <link rel="stylesheet" th:href="@{/css/gym-style.css}">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="menu-card-icon">💪</div>
            <h2>Bienvenido de vuelta</h2>
            <p>Ingresa a tu cuenta para continuar</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger">
            <span>⚠️Usuario o contraseña incorrecta. Si tu usuario está inactivo tampoco te permitirá iniciar sesión.</span>
            <span th:text="${session.SPRING_SECURITY_LAST_EXCEPTION?.message}">Credenciales inválidas</span>
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            <span>✓</span>
            <span>Sesión cerrada correctamente</span>
        </div>

        <form th:action="@{/auth/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="username">Correo institucional</label>
                <input id="username" name="username" type="text" placeholder="tu@u.icesi.edu.co" required />
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" placeholder="••••••••" required />
            </div>

            <button type="submit" class="btn btn-primary btn-lg">Ingresar</button>
        </form>

        <div class="auth-divider">
            <span>o</span>
        </div>

        <div class="auth-footer">
            <p>¿No tienes una cuenta?</p>
            <a th:href="@{/auth/create-user}" class="btn btn-outline">
                Registrarse
            </a>
        </div>
    </div>
</div>
</body>
</html>
