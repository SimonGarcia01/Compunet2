<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Enrollment</title>
    </head>
    <body>
        <h1>Enroll a student to a Course</h1>
        <form method="POST" th:action="@{/enrollments/save}" th:object="${studentCourse}">
            <select th:field="*{studentCourseId.studentId}">
                <option th:each="student : ${students}" th:text="${student.name}" th:value="${student.id}"></option>
            </select>
            <select th:field="*{studentCourseId.courseId}">
                <option th:each="course : ${courses}" th:text="${course.name}" th:value="${course.id}"></option>
            </select>
            <button type="submit">Save</button>
        </form>

        <h2>Listed Enrollments</h2>
        <ul th:each="enrollment : ${enrollments}">
            <li th:text="${enrollment.student.name +' - '+ enrollment.course.name}"></li>
        </ul>
    </body>
</html>
