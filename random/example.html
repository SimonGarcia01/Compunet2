<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dark Purple Demo</title>
  <link rel="stylesheet" href="dark-purple.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <span class="lead">CSS Cheat</span>
      <h1>Dark purple UI</h1>
      <p class="muted">A compact demo of layout, forms and buttons using the dark-purple theme.</p>

      <div class="hr"></div>

      <div class="row mt-1">
        <div class="col">
          <label class="muted">Name</label>
          <input class="input" placeholder="Your name">
        </div>
        <div style="width:150px">
          <label class="muted">Role</label>
          <select class="select">
            <option>Student</option>
            <option>Teacher</option>
          </select>
        </div>
      </div>

      <div class="mt-2 center">
        <button class="btn">Submit</button>
        <button class="btn secondary">Cancel</button>
      </div>
    </div>
  </div>
</body>
</html>
