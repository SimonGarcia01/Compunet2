<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Rol - Gym App</title>
    <link rel="stylesheet" th:href="@{/css/gym-style.css}">
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <div class="page-header">
            <h1>Crear Nuevo Rol</h1>
            <p>Define un nuevo rol con sus privilegios</p>
        </div>

        <nav>
            <a th:href="@{/roles}">← Volver a Roles</a>
            <a th:href="@{/home}">🏠 Inicio</a>
        </nav>

        <div class="card" style="max-width: 700px; margin: 0 auto;">
            <div th:if="${success}" class="alert alert-success">
                <span>✓</span>
                <span th:text="${success}"></span>
            </div>

            <div th:if="${error}" class="alert alert-danger">
                <span>⚠️</span>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/roles/create}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="name">Nombre del Rol</label>
                    <input id="name" type="text" name="name" placeholder="Administrador" required/>
                </div>

                <div class="form-group">
                    <label for="description">Descripción</label>
                    <input id="description" type="text" name="description"
                           placeholder="Rol con permisos administrativos"/>
                </div>

                <div class="form-group">
                    <label>Privilegios</label>
                    <div class="checkbox-group">
                        <div th:each="p : ${privileges}" class="checkbox-item">
                            <input type="checkbox"
                                   th:id="${'priv-' + p.privilegeId}"
                                   name="privilegeIds"
                                   th:value="${p.privilegeId}"/>
                            <label th:for="${'priv-' + p.privilegeId}" class="checkbox-label">
                                <span th:text="${p.name}">Ver usuarios</span>
                                <small class="checkbox-description" th:text="${p.description}">desc</small>
                            </label>
                        </div>
                    </div>
