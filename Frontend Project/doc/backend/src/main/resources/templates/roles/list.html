<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roles - Gym App</title>
    <link rel="stylesheet" th:href="@{/css/gym-style.css}">
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <div class="page-header">
            <h1>Gestión de Roles</h1>
            <p>Administrar roles del sistema</p>
        </div>

        <nav>
            <a th:href="@{/home}">🏠 Inicio</a>
            <a th:href="@{/roles/create}">➕ Crear Rol</a>
            <a th:href="@{/privileges}">🔐 Privilegios</a>
            <a th:href="@{/users}">👥 Usuarios</a>
        </nav>

        <div th:if="${success}" class="alert alert-success">
            <span>✓</span>
            <span th:text="${success}"></span>
        </div>

        <div th:if="${error}" class="alert alert-danger">
            <span>⚠️</span>
            <span th:text="${error}"></span>
        </div>

        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${roles}">
                        <td th:text="${r.roleId}">1</td>
                        <td><strong th:text="${r.name}">Administrador</strong></td>
                        <td th:text="${r.description}">Rol admin</td>
                        <td>
                            <div class="table-actions">
                                <a th:href="@{|/roles/${r.roleId}/edit-privileges|}" class="btn btn-sm btn-primary">
                                    Asociar Permisos
                                </a>
                                <form th:action="@{|/roles/${r.roleId}/delete|}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm btn-danger"
                                            onclick="return confirm('¿Eliminar rol?')">
                                        Eliminar
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(roles)}">
                        <td colspan="4" class="text-center" style="padding: 2rem;">
                            No hay roles registrados
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
